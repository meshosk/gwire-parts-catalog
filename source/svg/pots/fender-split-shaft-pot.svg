    </g>
  <g fill="#d4d7c7" stroke="#8b9d8e" stroke-width="1">
    <circle cx="128" cy="185" r="4"/><circle cx="232" cy="185" r="4"/>
    <circle cx="116" cy="213" r="4"/><circle cx="244" cy="213" r="4"/>
    <circle cx="116" cy="263" r="4"/><circle cx="244" cy="263" r="4"/>
