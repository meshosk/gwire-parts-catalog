<svg xmlns="http://www.w3.org/2000/svg" width="440" height="480" viewBox="180 -20 440 480" role="img" aria-labelledby="gh-title gh-description">
  <title id="gh-title">Gibson humbucker s kovovým krytom a piatimi vodičmi</title>
  <desc id="gh-description">Štylizovaný horný pohľad podľa referenčnej fotografie: lesklý niklový kryt, šesť nastaviteľných skrutiek v zvislom rade naľavo a dve montážne ušká. Telo je otočené o 90 stupňov; geometria vodičov zostáva nezmenená. Z pravého dolného boku vychádza krátky kábel s piatimi samostatne vyvedenými koncami podľa dodanej farebnej schémy. Červený North Start, biely North Finish, zelený South Finish, čierny South Start a holé tienenie. Vodiče nie sú navzájom spojené. Body pripojenia: terminal-red (600, 145), terminal-white (600, 185), terminal-green (600, 225), terminal-black (600, 265), terminal-shield (600, 305). Priehľadné pozadie a montážne otvory.</desc>
  <defs>
    <linearGradient id="gh-cover" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#eeeae0"/><stop offset="0.12" stop-color="#c9c6bf"/><stop offset="0.36" stop-color="#a4a3a1"/><stop offset="0.62" stop-color="#b9b8b2"/><stop offset="0.84" stop-color="#d0cfc8"/><stop offset="1" stop-color="#8f9497"/>
    </linearGradient>
    <linearGradient id="gh-rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f8f7ee"/><stop offset="0.12" stop-color="#c6cbc9"/><stop offset="0.3" stop-color="#f0f2ed"/><stop offset="0.57" stop-color="#8c9495"/><stop offset="0.83" stop-color="#505d63"/><stop offset="0.93" stop-color="#f0f0e8"/><stop offset="1" stop-color="#a5adae"/>
    </linearGradient>
    <linearGradient id="gh-bottom-edge" x1="0" y1="0" x2="0.1" y2="1">
      <stop stop-color="#484b4c"/><stop offset="0.25" stop-color="#d5d7d1"/><stop offset="0.65" stop-color="#b8bcb9"/><stop offset="1" stop-color="#ecece4"/>
    </linearGradient>
    <linearGradient id="gh-metal" x1="0" y1="0" x2="1" y2="0.7">
      <stop stop-color="#9d9e94"/><stop offset="0.28" stop-color="#e9e6d8"/><stop offset="0.53" stop-color="#b3b6ae"/><stop offset="0.77" stop-color="#faf9ef"/><stop offset="1" stop-color="#959f9e"/>
    </linearGradient>
    <radialGradient id="gh-screw" cx="0.3" cy="0.24" r="0.85">
      <stop stop-color="#ffffff"/><stop offset="0.35" stop-color="#ecede6"/><stop offset="0.67" stop-color="#a5afaf"/><stop offset="0.87" stop-color="#f6f6ed"/><stop offset="1" stop-color="#747f83"/>
    </radialGradient>
    <g id="gh-pole-screw">
      <circle r="18" fill="#7c8384" stroke="#d8dcd5" stroke-width="1.2"/>
      <circle r="15.8" fill="url(#gh-screw)" stroke="#5e6b70" stroke-width="0.8"/>
      <path d="M-2.7-14.5 H2.7 V14.5 H-2.7 Z" fill="#465055"/>
      <path d="M-2.7-13 V13" fill="none" stroke="#f2f3e9" stroke-width="1.2"/>
      <path d="M-11-7 A13 13 0 0 1 9-10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Four insulated conductors and an independent bare shield, left unjoined. -->
  <g id="pickup-leads" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#622829" stroke-width="8">
      <path d="M484 232 C523 232 511 145 548 145 H584"/>
    </g>
    <path id="wire-red" d="M484 232 C523 232 511 145 548 145 H584" stroke="#c83c3f" stroke-width="6"/>
    <path d="M539 148 Q544 145 553 145 H582" stroke="#ef8480" stroke-width="1.3"/>
    <path d="M484 232 C521 232 519 185 550 185 H584" stroke="#8a9290" stroke-width="8"/>
    <path id="wire-white" d="M484 232 C521 232 519 185 550 185 H584" stroke="#f0f0e7" stroke-width="6"/>
    <path d="M484 232 C518 232 524 225 551 225 H584" stroke="#295a40" stroke-width="8"/>
    <path id="wire-green" d="M484 232 C518 232 524 225 551 225 H584" stroke="#46905b" stroke-width="6"/>
    <path d="M546 224 H582" stroke="#86bb89" stroke-width="1.2"/>
    <path d="M484 232 C521 232 522 265 550 265 H584" stroke="#4c5559" stroke-width="8"/>
    <path id="wire-black" d="M484 232 C521 232 522 265 550 265 H584" stroke="#20272b" stroke-width="6"/>
    <path d="M548 264 H581" stroke="#687277" stroke-width="1.1"/>
    <path id="wire-shield" d="M484 232 C522 232 514 305 551 305 H600" stroke="#899797" stroke-width="5.5"/>
    <path d="M484 231 C522 231 514 304 551 304 H600" stroke="#d7ded4" stroke-width="2.5"/>
    <g stroke="#788887" stroke-width="1">
      <path d="M551 302 L555 307 M558 302 L562 307 M565 302 L569 307 M572 302 L576 307 M579 302 L583 307"/>
    </g>
    <!-- Exposed tinned ends are the wire attachment points. -->
    <g stroke="#7b888b" stroke-width="5.5">
      <path id="terminal-red" d="M584 145 H600"/>
      <path id="terminal-white" d="M584 185 H600"/>
      <path id="terminal-green" d="M584 225 H600"/>
      <path id="terminal-black" d="M584 265 H600"/>
      <path id="terminal-shield" d="M584 305 H600"/>
    </g>
    <path d="M585 144 H600 M585 184 H600 M585 224 H600 M585 264 H600 M585 304 H600" stroke="#e3e9df" stroke-width="2"/>
    <!-- The common outer jacket hides the origins of the separate wires. -->
    <path d="M435 225 C457 225 465 231 490 232" stroke="#171e22" stroke-width="15"/>
    <path d="M443 222 C461 222 470 229 486 229" stroke="#667175" stroke-width="2.2"/>
  </g>

  <!-- Rotate the pickup body only; all wire paths remain in their original coordinates. -->
  <g id="pickup-body" transform="translate(320 220) rotate(-90) translate(-262 -154)">
  <!-- Baseplate mounting ears, with transparent screw holes. -->
  <g id="mounting-ears" fill="url(#gh-metal)" fill-rule="evenodd" stroke="#8b9593" stroke-width="1.5">
    <path d="M44 128 H89 V180 H44 Q36 180 36 172 V136 Q36 128 44 128 Z M45 150 V158 A6 6 0 0 0 57 158 V150 A6 6 0 0 0 45 150 Z"/>
    <path d="M435 128 H480 Q488 128 488 136 V172 Q488 180 480 180 H435 Z M467 150 V158 A6 6 0 0 0 479 158 V150 A6 6 0 0 0 467 150 Z"/>
  </g>

  <!-- The bottom lip remains visible beneath the gently rounded nickel cover. -->
  <rect x="69" y="49" width="386" height="220" rx="17" fill="url(#gh-bottom-edge)" stroke="#a2aaa7" stroke-width="1.2"/>
  <rect x="70" y="39" width="384" height="219" rx="16" fill="url(#gh-rim)" stroke="#7d8583" stroke-width="1.4"/>
  <rect x="77" y="44" width="370" height="204" rx="11" fill="url(#gh-cover)" stroke="#626c6f" stroke-width="1.3"/>
  <path d="M84 48 Q79 48 79 58 V234 M85 46 H434 Q443 46 443 55" fill="none" stroke="#fffef3" stroke-width="2" stroke-linecap="round"/>
  <path d="M81 242 Q85 246 96 246 H431 Q444 246 445 234" fill="none" stroke="#3f4a50" stroke-width="2"/>
  <path d="M86 250 H436" fill="none" stroke="#fcf9ec" stroke-opacity="0.75" stroke-width="1.5"/>
  <path d="M451 62 V234" fill="none" stroke="#f6f4e8" stroke-width="1.6"/>
  <path d="M81 260 H441" fill="none" stroke="#e7e7df" stroke-opacity="0.75" stroke-width="1.5"/>

  <!-- Six individually slotted pole screws in the single exposed row. -->
  <g id="pole-screws">
    <use href="#gh-pole-screw" transform="translate(112 88) rotate(-12)"/>
    <use href="#gh-pole-screw" transform="translate(172 88) rotate(3)"/>
    <use href="#gh-pole-screw" transform="translate(232 88) rotate(88)"/>
    <use href="#gh-pole-screw" transform="translate(292 88) rotate(-54)"/>
    <use href="#gh-pole-screw" transform="translate(352 88) rotate(76)"/>
    <use href="#gh-pole-screw" transform="translate(412 88) rotate(-19)"/>
  </g>
  </g>
</svg>
