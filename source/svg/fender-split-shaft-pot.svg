    <linearGradient id="s1-metal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#707b72"/><stop offset="0.3" stop-color="#d4d9d1"/><stop offset="0.52" stop-color="#909b90"/><stop offset="0.8" stop-color="#e1e4da"/><stop offset="1" stop-color="#788477"/>
    </linearGradient>
    <linearGradient id="s1-plating" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#fffdeb"/><stop offset="0.4" stop-color="#e4e7d8"/><stop offset="0.75" stop-color="#a9b5a3"/><stop offset="1" stop-color="#edf0de"/>
    </linearGradient>
    <linearGradient id="s1-solder" x1="0" y1="0" x2="0.6" y2="1">
      <stop stop-color="#e1e6dc"/><stop offset="0.4" stop-color="#b9c5b5"/><stop offset="1" stop-color="#687d66"/>
    </linearGradient>
    <linearGradient id="s1-green" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#26835a"/><stop offset="0.5" stop-color="#166d44"/><stop offset="1" stop-color="#105b36"/>
    </linearGradient>
  </defs>
