<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="185 80 160 210" role="img" aria-labelledby="s1-title s1-description">
  <title id="s1-title">Fender potenciometer s tlačidlovým prepínačom — kontaktná strana</title>
  <desc id="s1-description">Geometricky súmerná kresba podľa dodanej fotografie: kruhová zelená doska, dvanásť samostatných otvorov po obvode, dve skupiny po šiestich samostatných spájkovacích bodoch a tri vývody potenciometra dole. Všetky otvory aj spájkovacie body sú vzájomne oddelené zelenou medzerou. Bez potlače a s priehľadným pozadím. Identifikátory kontaktov nie sú elektrickým číslovaním výrobcu.</desc>
