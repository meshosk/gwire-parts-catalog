<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="cap-title cap-description">
  <title id="cap-title">Oranžový diskový kondenzátor bez potlače</title>
  <desc id="cap-description">Štylizovaná súčiastka pre gitarové schémy zapojenia podľa dodanej fotografie. Telo bez potlače a bez viditeľných textov, pripravené na doplnenie hodnoty. Priehľadné pozadie. Body pripojenia: (112, 292), (208, 292).</desc>
