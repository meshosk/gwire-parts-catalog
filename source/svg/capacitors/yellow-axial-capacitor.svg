<svg xmlns="http://www.w3.org/2000/svg" width="440" height="180" viewBox="0 0 440 180" role="img" aria-labelledby="cap-title cap-description">
  <title id="cap-title">Žltý axiálny kondenzátor bez potlače</title>
  <desc id="cap-description">Štylizovaná súčiastka pre gitarové schémy zapojenia podľa dodanej fotografie. Telo bez potlače a bez viditeľných textov, pripravené na doplnenie hodnoty. Priehľadné pozadie. Body pripojenia: (20, 90), (420, 90).</desc>
  <defs>
    <linearGradient id="cap-body" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#fff369"/><stop offset="0.55" stop-color="#f6da25"/><stop offset="1" stop-color="#d7b71b"/>
    </linearGradient>
    <linearGradient id="cap-wire" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#92999d"/><stop offset="0.42" stop-color="#f1f3f2"/><stop offset="1" stop-color="#9ca3a7"/>
    </linearGradient>
  </defs>
  <g>
    <path id="terminal-1" d="M20 90 H140" fill="none" stroke="#5c6266" stroke-width="8" stroke-linecap="round"/>
    <path id="terminal-2" d="M300 90 H420" fill="none" stroke="#5c6266" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 90 H140 M300 90 H420" fill="none" stroke="url(#cap-wire)" stroke-width="5.5" stroke-linecap="round"/>
</g>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 39 Q135 39 135 48 V132 Q135 141 144 141 H296 Q305 141 305 132 V48 Q305 39 296 39Z" fill="url(#cap-body)" stroke="#a98c20" stroke-width="2.4"/>
    <path d="M143 43 V137 M297 43 V137" fill="none" stroke="#d4ad19" stroke-width="2"/>
    <path d="M150 47 H288" fill="none" stroke="#fff6ad" stroke-opacity="0.8" stroke-width="3"/>
    <path d="M150 133 H288" fill="none" stroke="#bba01c" stroke-opacity="0.5" stroke-width="2"/>
</g>
</svg>
