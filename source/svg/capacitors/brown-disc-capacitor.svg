    </linearGradient>
    <linearGradient id="cap-wire" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#92999d"/><stop offset="0.42" stop-color="#f1f3f2"/><stop offset="1" stop-color="#9ca3a7"/>
    </linearGradient>
  </defs>
  <g><path id="terminal-1" d="M130 155 V292" fill="none" stroke="#5c6266" stroke-width="9" stroke-linecap="round"/><path d="M130 155 V292" fill="none" stroke="url(#cap-wire)" stroke-width="6" stroke-linecap="round"/>
<path id="terminal-2" d="M190 155 V292" fill="none" stroke="#5c6266" stroke-width="9" stroke-linecap="round"/><path d="M190 155 V292" fill="none" stroke="url(#cap-wire)" stroke-width="6" stroke-linecap="round"/></g>
