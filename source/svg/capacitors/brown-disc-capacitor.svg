<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="cap-title cap-description">
  <title id="cap-title">Malý hnedý diskový kondenzátor bez potlače</title>
